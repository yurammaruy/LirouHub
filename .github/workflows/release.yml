name: Compilar e publicar o plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar o .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Baixar o Dalamud
        shell: pwsh
        run: |
          $dest = Join-Path $env:GITHUB_WORKSPACE 'dalamud'
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath $dest -Force
          "DALAMUD_HOME=$dest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compilar
        shell: pwsh
        run: |
          $versao = '${{ github.event.release.tag_name }}'
          dotnet build plugin/LirouHub.csproj -c Release -p:Version=$versao
          if ($LASTEXITCODE -ne 0) { throw 'A compilacao falhou.' }

      - name: Montar o latest.zip
        shell: pwsh
        run: |
          $versao = '${{ github.event.release.tag_name }}'
          $dll = Get-ChildItem -Path plugin/bin/Release -Recurse -Filter 'LirouHub.dll' | Select-Object -First 1
          if (-not $dll) { throw 'Nao achei o LirouHub.dll depois de compilar.' }
          $pasta = Join-Path $env:RUNNER_TEMP 'pacote'
          New-Item -ItemType Directory -Force -Path $pasta | Out-Null
          Copy-Item $dll.FullName $pasta
          $pdb = Join-Path $dll.DirectoryName 'LirouHub.pdb'
          if (Test-Path $pdb) { Copy-Item $pdb $pasta }
          $manifest = Get-Content plugin/LirouHub.json -Raw | ConvertFrom-Json
          $manifest | Add-Member -NotePropertyName AssemblyVersion -NotePropertyValue $versao -Force
          $manifest | Add-Member -NotePropertyName DalamudApiLevel -NotePropertyValue 15 -Force
          $manifest | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $pasta 'LirouHub.json') -Encoding utf8
          Compress-Archive -Path (Join-Path $pasta '*') -DestinationPath latest.zip -Force

      - name: Anexar o latest.zip na Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ github.event.release.tag_name }}' latest.zip --clobber --repo '${{ github.repository }}'

      - name: Atualizar o repo.json
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versao = '${{ github.event.release.tag_name }}'
          $repo = '${{ github.repository }}'
          $link = "https://github.com/$repo/releases/latest/download/latest.zip"
          $obj = [ordered]@{
            Author = 'Lirou'
            Name = 'Lirou Hub'
            InternalName = 'LirouHub'
            AssemblyVersion = $versao
            Description = 'Plugin hospedeiro: busca o FFBL e o Twitch World nos repositorios do GitHub, liga os dois dentro dele e mostra um OK verde ou um relatorio de erro. Comando: /lirouhub'
            Punchline = 'Carrega o FFBL e o Twitch World por dentro e mostra se deu certo.'
            ApplicableVersion = 'any'
            RepoUrl = "https://github.com/$repo"
            Tags = @('hub', 'ffbl', 'twitch')
            DalamudApiLevel = 15
            IsHide = $false
            IsTestingExclusive = $false
            DownloadLinkInstall = $link
            DownloadLinkTesting = $link
            DownloadLinkUpdate = $link
            LastUpdate = [int][double]::Parse((Get-Date -UFormat %s))
          }
          git fetch origin main
          git checkout main
          ConvertTo-Json -InputObject @($obj) -Depth 5 | Set-Content repo.json -Encoding utf8
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add repo.json
          git commit -m "repo.json: versao $versao"
          git push origin main
